name: CI

# Build + self-test on every push to main and on pull requests, so a broken
# build (link errors, missing Qt module, failing patcher engine) is caught
# long before a release tag is pushed.  Run it manually from any branch with
# "Run workflow" to check work in progress.
on:
  push:
    branches: [main, arena/3f309c3c-bsi-customizer, arena/c19d0730-bsi-customizer, arena/038fda0d-bsi-customizer]
  pull_request:
  workflow_dispatch:
    inputs:
      test_supplied_dll:
        description: 'Opt in: test the pinned Z-Lag DLL in an offline disposable Windows probe (not the emulator)'
        type: boolean
        required: false
        default: false
      test_potato_dll:
        description: 'Opt in: run the exact supplied Potato DLLs in an offline software-WGL probe (not the emulator)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"
  # The self-test must stay offline: the updater is disabled here on purpose.
  BSI_NO_UPDATER: "1"
  BSI_SKIN_REFERENCE_DIR: ${{ github.workspace }}/player-ui-source

jobs:
  payload-choice:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_supplied_dll && inputs.test_potato_dll }}
    name: Refuse simultaneous unrelated payload tests
    runs-on: ubuntu-latest
    steps:
      - run: echo '::error::Choose either Z-Lag or Potato, never both in one probe run.' && exit 1

  supplied-dll-validation:
    name: Opt-in supplied DLL test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_supplied_dll && !inputs.test_potato_dll }}
    uses: ./.github/workflows/dll-payload-test.yml

  potato-dll-validation:
    name: Opt-in original Potato DLL test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_potato_dll && !inputs.test_supplied_dll }}
    uses: ./.github/workflows/potato-dll-probe.yml
    with:
      execute_original_dll: ${{ inputs.test_potato_dll }}

  rpc-scan-regression:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.test_supplied_dll && !inputs.test_potato_dll) }}
    name: RPC scan equivalence (Linux, Qt-free)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check optimized scan rules with sanitizers
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/rpc_scan_optimization_test.cpp src/core/RpcIdScan.cpp -o /tmp/rpc-scan-test
          /tmp/rpc-scan-test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc tests/player_appearance_scan_test.cpp src/core/PlayerAppearanceScan.cpp -o /tmp/player-appearance-test
          /tmp/player-appearance-test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/gif_rpc_payload_test.cpp -o /tmp/gif-rpc-payload-test
          /tmp/gif-rpc-payload-test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc tests/dll-startup/test.cpp src/core/DllStartupImport.cpp -o /tmp/dll-startup-test
          /tmp/dll-startup-test

  resources-ui-regression:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.test_supplied_dll && !inputs.test_potato_dll) }}
    name: Resources manual scan and search (Qt 6.8)
    # Keep the Qt 5/6 pixel-test toolchain on the same tested LTS as Chromium,
    # rather than allowing an ubuntu-latest image migration to change it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native 4.0.1 Skin Studio contracts
        run: node tests/native_skin_ui_test.mjs
      - name: Test Add-ons catalog and guarded review flow
        run: node tests/addons_test.mjs
      - name: Check native startup-DLL wiring and opt-in safety contracts
        run: |
          node tests/dll_startup_contract_test.mjs
          node tests/dll_startup_payload_contract_test.mjs
          node tests/potato_dll_probe_contract_test.mjs
      - name: Test resource search matching and large lists
        run: node tests/resource_search_test.mjs
      - name: Test Chromium Settings-panel rebuild controls and profile flow
        run: node tests/settings_panel_ui_test.mjs
      - name: Test Player Appearance Studio Chromium workflow
        run: node tests/player_appearance_ui_test.mjs
      - name: Test adaptive application window placement across display sizes
        run: node tests/window_geometry_test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Potato reference identities with synthetic data only (no supplied DLL execution)
        run: python -m unittest discover -s tests/potato-dll -p '*_test.py'
      - name: Verify bundled Settings-tab pack and complete resource budgets
        run: |
          python tests/settings_panel_icon_pack_test.py
          python tests/settings_panel_window_budget_test.py
          python tests/shaders/bundle_notices_test.py
      - name: Check DLL-startup audit input guards (no patcher or payload execution)
        run: python tests/dll_startup_audit_test.py
      - name: Install Qt runtime test dependencies
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/qt-runtime-deps.log"
          # A failed job's blob-storage log is not readable through this
          # account's API. Preserve the actual package error in annotations,
          # not just exit 100; never continue with missing Qt dependencies.
          report_failure() {
            status=$?
            message=""
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              message+="$line%0A"
            done < <(tail -n 60 "$log")
            # One multiline annotation avoids the per-step annotation limit
            # hiding the final apt diagnostic behind its retry progress lines.
            printf '::error::%s\n' "$message"
            exit "$status"
          }
          trap report_failure ERR
          # Fetch official Ubuntu indexes over HTTPS, avoiding stale cleartext
          # mirror/proxy cache entries. Keep normal signed-index verification.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i -E 's#http://((security|archive|azure\.archive)\.ubuntu\.com/ubuntu)#https://\1#g' "$sources"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::No-Cache=true update 2>&1 | tee "$log"
          sudo apt-get -o Acquire::Retries=3 install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 2>&1 | tee -a "$log"
          python -m pip install PySide6==6.8.3 PyQt5==5.15.11 2>&1 | tee -a "$log"
      - name: Checkout pinned player UI contracts for source compilation
        uses: actions/checkout@v5
        with:
          repository: husainprime20/src-code
          ref: ee557954ee9e1a251f20fe667d2bbcc1f711d26b
          path: player-ui-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: '/*.qml'
      - name: Compile and parse every player component for all six packs
        run: |
          sudo apt-get install -y qt6-base-dev pkg-config
          g++ -std=c++17 -O1 -ffunction-sections -fdata-sections -Wl,--gc-sections -Isrc \
            $(pkg-config --cflags Qt6Core) tests/player_skin_compile_test.cpp \
            src/core/PlayerSkinCompiler.cpp src/core/SkinProfiles.cpp \
            $(pkg-config --libs Qt6Core) -o /tmp/player-skin-compile-test
          /tmp/player-skin-compile-test player-ui-source "${{ runner.temp }}/generated-player-skins"
          python tests/player_skin_syntax_test.py "${{ runner.temp }}/generated-player-skins"
      - name: Generate titlebar details fixtures through the production C++ rewrite
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -fPIC -Isrc \
            $(pkg-config --cflags Qt6Core) tests/titlebar_details_test.cpp \
            src/core/TitlebarDetails.cpp src/core/QmlText.cpp \
            $(pkg-config --libs Qt6Core) -o /tmp/titlebar-details-test
          /tmp/titlebar-details-test "${{ runner.temp }}/titlebar-details" player-ui-source/PlrTopbar.qml
      - name: Render combined title-details removal and intact Settings text in Qt 6
        env:
          BSI_TITLE_DETAILS_FIXTURES: ${{ runner.temp }}/titlebar-details
        run: python tests/run_qt_runtime_test.py tests/titlebar_details_gui_test.py
      - name: Render the same title-details and Settings-text regression in Qt 5
        env:
          BSI_TITLE_DETAILS_FIXTURES: ${{ runner.temp }}/titlebar-details
          BSI_TEST_QT_API: PyQt5
        run: python tests/run_qt_runtime_test.py tests/titlebar_details_gui_test.py
      - name: Type-check Workspace and Theme QML against real Qt metadata
        run: python tests/workspace_qml_lint_test.py
      - name: Exercise opt-in native startup-DLL review and recovery controls
        run: python tests/run_qt_runtime_test.py tests/dll_startup_ui_test.py
      - name: Click DLL patcher in the full app sidebar and Collection (mock services)
        env:
          BSI_UI_SCREENSHOT_DIR: ${{ runner.temp }}/control-center-ui
        run: python tests/run_qt_runtime_test.py tests/dll_startup_shell_test.py
      - name: Exercise native Skin Studio and redesigned login
        env:
          BSI_UI_SCREENSHOT_DIR: ${{ runner.temp }}/control-center-ui
        run: python tests/run_qt_runtime_test.py tests/native_skin_runtime_test.py
      - name: Upload actual native control-center screenshots (mock services)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-control-center-${{ github.run_id }}
          path: ${{ runner.temp }}/control-center-ui/*.png
          if-no-files-found: ignore
      - name: Instantiate rebuilt Settings shell and test its native interactions
        run: python tests/run_qt_runtime_test.py tests/settings_panel_runtime_test.py
      - name: Verify Settings geometry and selected icon pixels in Qt 6
        run: python tests/run_qt_runtime_test.py tests/settings_panel_post_patch_gui_test.py
      - name: Verify the same Settings geometry, hover and icon pixels in Qt 5
        env:
          BSI_TEST_QT_API: PyQt5
        run: python tests/run_qt_runtime_test.py tests/settings_panel_post_patch_gui_test.py
      - name: Full generated Settings glass pixels, translucency and native-control input (Qt 6)
        run: python tests/run_qt_runtime_test.py tests/settings_panel_glass_test.py
      - name: The same complete glass resources, inputs and popup behavior (independent Qt 5)
        env:
          BSI_TEST_QT_API: PyQt5
        run: python tests/run_qt_runtime_test.py tests/settings_panel_glass_test.py
      - name: Exercise the interactive generated-Settings live preview (sample services)
        run: python tests/run_qt_runtime_test.py tests/settings_window_preview_test.py
      - name: Exercise adaptive boot player against synthetic Qt6, Qt5 and WebEngine APIs
        run: python tests/run_qt_runtime_test.py tests/boot_player_runtime_test.py
      - name: Load the real Resources page with a counting backend
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: python tests/run_qt_runtime_test.py tests/resources_page_runtime_test.py
      - name: Exercise the native Settings-panel rebuild tab in the Player interface
        run: python tests/run_qt_runtime_test.py tests/ui_page_settings_panel_test.py

  dll-startup-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.test_supplied_dll && !inputs.test_potato_dll) }}
    name: Regular DLL normal startup (Windows x64, no proxy/runtime)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: MrPcGamerYT/HD-Player
          ref: 6e4dc894eb1b6956060b3f76d13fc438e5178d03
          path: hd-player-reference
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pefile==2024.8.26
      - name: Build original harmless host/DLL fixtures and native file tests
        run: |
          cmake -S tests/dll-startup -B build-dll-startup -A x64 -DBSI_DLLSTARTUP_FILE_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Startup test configuration failed' }
          cmake --build build-dll-startup --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Startup test build failed' }
      - name: Exercise actual Windows loading plus file failures and rollback
        run: ctest --test-dir build-dll-startup -C Release --output-on-failure
      - name: Independently check all four real player references (data only)
        run: python tests/dll_startup_native_test.py --engine build-dll-startup/Release/dll-startup-test.exe --file-test build-dll-startup/Release/dll-startup-file-test.exe --reference-dir hd-player-reference
      - name: Prepare through production native transaction; exit patcher
        run: |
          & build-dll-startup/Release/dll-startup-file-test.exe --prepare-deployment build-dll-startup/Release/startup-host.exe build-dll-startup/Release/startup-with-export.dll "$env:RUNNER_TEMP/prepared-startup"
          if ($LASTEXITCODE -ne 0) { throw 'Native deployment preparation failed' }
      - name: Recipient needs only patched EXE plus regular DLL, not patcher/interpreters
        shell: pwsh
        run: |
          $recipient = Join-Path $env:RUNNER_TEMP 'recipient with spaces'
          New-Item -ItemType Directory $recipient | Out-Null
          Copy-Item "$env:RUNNER_TEMP/prepared-startup/HD-Player.exe" $recipient
          Copy-Item "$env:RUNNER_TEMP/prepared-startup/bsi-startup-probe.dll" $recipient
          if ((Get-ChildItem $recipient -File).Count -ne 2) { throw 'Recipient fixture must contain only EXE and DLL' }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_PLUGIN_PATH = ''
          $env:QML_IMPORT_PATH = ''
          $env:QML2_IMPORT_PATH = ''
          Remove-Item Env:BSI_DLLSTARTUP_ATTACHED -ErrorAction SilentlyContinue
          Remove-Item Env:BSI_DLLSTARTUP_EXPORTED_INIT -ErrorAction SilentlyContinue
          for ($launch = 1; $launch -le 3; $launch++) {
            $p = Start-Process -FilePath (Join-Path $recipient 'HD-Player.exe') -WorkingDirectory $recipient -PassThru
            if (-not $p.WaitForExit(10000)) { $p.Kill(); throw 'Harmless recipient startup timed out' }
            if ($p.ExitCode -ne 0) { throw "Harmless DLL was not initialized on normal launch $launch (exit $($p.ExitCode))" }
          }
          'PASS: three ordinary launches; only EXE + regular DLL; export resolved but not called; patcher already exited; no interpreter/Qt/SDK on PATH.' | Out-File $env:GITHUB_STEP_SUMMARY -Append

  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.test_supplied_dll && !inputs.test_potato_dll) }}
    name: Build & self-test (Windows x64 · ${{ matrix.label }})
    runs-on: windows-latest
    # The two "latest package" jobs legitimately run ~58 minutes (build + the
    # full self-test against every reference player), which left no room for a
    # single new check: a 60 minute cap turned a green suite into a timeout.
    # Keep a margin so added coverage fails on its assertion, never on the clock.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: MSI latest package
            reference-file: HD-Player MSI Latest version.zip
          - label: MSI v5.9
            reference-file: HD-Player MSI v5.9.exe
          - label: BlueStacks 5 latest package
            reference-file: HD-Player latest version Bluestacks 5.zip
          - label: BlueStacks v5.10
            reference-file: HD-Player v.5.10 bluestacks.exe

    steps:
      - name: Checkout BSI Customizer
        uses: actions/checkout@v5

      - name: Checkout pinned HD-Player reference images
        uses: actions/checkout@v5
        with:
          repository: MrPcGamerYT/HD-Player
          ref: 6e4dc894eb1b6956060b3f76d13fc438e5178d03
          path: hd-player-reference
          persist-credentials: false

      - name: Prepare the selected HD-Player reference
        shell: pwsh
        env:
          REFERENCE_FILE: ${{ matrix.reference-file }}
        run: |
          $source = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'hd-player-reference') $env:REFERENCE_FILE
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Reference file not found in pinned HD-Player repo: $env:REFERENCE_FILE"
          }
          if ($source.EndsWith('.zip', [StringComparison]::OrdinalIgnoreCase)) {
            $extract = Join-Path $env:RUNNER_TEMP 'hd-player-extract'
            Expand-Archive -LiteralPath $source -DestinationPath $extract -Force
            $player = Get-ChildItem -LiteralPath $extract -Filter 'HD-Player.exe' -File -Recurse |
                      Select-Object -First 1 -ExpandProperty FullName
            if (-not $player) { throw "No HD-Player.exe found inside $env:REFERENCE_FILE" }
          } else {
            $player = $source
          }
          $target = Join-Path $env:GITHUB_WORKSPACE 'HD-Player.exe'
          Copy-Item -LiteralPath $player -Destination $target -Force
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "| $env:REFERENCE_FILE | $((Get-Item -LiteralPath $target).Length) | $hash |" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "Reference copied as data only: $target (SHA256 $hash)"

      - name: Checkout pinned player UI source contracts (data only)
        uses: actions/checkout@v5
        with:
          repository: husainprime20/src-code
          ref: ee557954ee9e1a251f20fe667d2bbcc1f711d26b
          path: player-ui-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: '/*.qml'

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        env:
          # Whole auth.json to embed at build time (falls back to the
          # BSIC_AUTH_JSON secret name; empty = build without an embed).
          ZLP_AUTH_JSON: ${{ secrets.ZLP_AUTH_JSON || secrets.BSIC_AUTH_JSON }}
          BSI_EXE_TEST_FILE: ${{ github.workspace }}/HD-Player.exe
        # Each matrix job compiles the same diagnostic against one real reference.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBSI_CHROMIUM_UI=OFF "-DBSI_EXE_TEST_FILE=$env:BSI_EXE_TEST_FILE"

      - name: Build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0) { exit 0 }

          # The job log of a failed run is not retrievable from the API on this
          # account (the blob storage redirect answers EOF), so the compiler
          # errors are republished as check-run annotations - they are.
          $pattern = ': (error|fatal error) [A-Z]+[0-9]+'
          $hits = Select-String -Path $log -Pattern $pattern -Context 0, 1
          $count = 0
          foreach ($hit in $hits) {
            if ($count -ge 40) { break }
            $text = $hit.Line.Trim()
            if ($hit.Context.PostContext.Count -gt 0) {
              $text += ' ' + ($hit.Context.PostContext -join ' ')
            }
            $text = $text -replace '%', '%25' -replace "`r", ' ' -replace "`n", ' '
            if ($text.Length -gt 400) { $text = $text.Substring(0, 400) }
            Write-Host "::error::$text"
            $count++
          }
          if ($count -eq 0) {
            $tail = Get-Content -LiteralPath $log -Tail 25
            Write-Host '::error::build failed without a compiler error line; last lines:'
            foreach ($line in $tail) {
              $clean = $line -replace '%', '%25' -replace "`r", ' '
              Write-Host "::error::$clean"
            }
          }
          exit 1

      - name: Locate build output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter 'BSI-Customizer.exe' -File |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            throw 'BSI-Customizer.exe not found under build/ - did the build step succeed?'
          }
          Write-Host "exe: $exe"
          "exe=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify embedded UAC manifest
        shell: pwsh
        run: |
          $sdk = Join-Path "${env:ProgramFiles(x86)}" 'Windows Kits\10\bin'
          $mt = Get-ChildItem $sdk -Recurse -Filter mt.exe -File -ErrorAction SilentlyContinue |
                Where-Object FullName -match '\\x64\\mt\.exe$' |
                Sort-Object FullName | Select-Object -Last 1
          if (-not $mt) {
            Write-Warning 'mt.exe not found - skipping manifest verification'
            exit 0
          }

          $out = Join-Path $env:RUNNER_TEMP 'embedded.manifest'
          & $mt.FullName -nologo "-inputresource:$env:exe;#1" "-out:$out" | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) {
            throw "No manifest resource (id 1) is embedded in $env:exe"
          }
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern 'requireAdministrator' -Quiet)) {
            throw 'Embedded manifest does not request administrator rights'
          }
          Write-Host 'OK: requireAdministrator manifest is embedded'

      - name: Packaging licence collector self-test (offline)
        shell: pwsh
        run: cmake -P cmake/tests/CollectQtNoticesTest.cmake

      - name: Self-test (theme changer + config engine)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          __COMPAT_LAYER: RUNASINVOKER
          # Export authored scenes through the actual resource patchers, not
          # QML read from the reference player. Physical checks run below.
          BSI_TOPBAR_TEST_FIXTURES: ${{ runner.temp }}/topbar-ui
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'selftest.log'
          $err = Join-Path $env:RUNNER_TEMP 'selftest.err'

          # Start-Process rather than '&': the exe is a GUI-subsystem app, so
          # PowerShell would not wait for it, and we need its stdout captured.
          $p = Start-Process -FilePath $env:exe -ArgumentList '--selftest' `
                 -NoNewWindow -Wait -PassThru `
                 -RedirectStandardOutput $log -RedirectStandardError $err

          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue

          $passed = Select-String -Path $log -Pattern 'ALL TESTS PASSED' -Quiet
          # A run that never printed its summary died before the end (a crash,
          # an abort), and then the lines that mention "fail" say nothing about
          # where it stopped: the tail of the log is what has to be published.
          $summarised = Select-String -Path $log -Pattern 'SELF-TEST FAILED|ALL TESTS PASSED' -Quiet
          if ($p.ExitCode -ne 0 -or -not $passed) {
            # A failed job's log cannot be read back through the API on this
            # account, so the lines that explain the failure are republished as
            # annotations, which can.
            $lines = @()
            foreach ($file in @($log, $err)) {
              if (Test-Path -LiteralPath $file) {
                $lines += Get-Content -LiteralPath $file | Where-Object { $_ -match 'FAIL|failed|Failure' }
              }
            }
            $count = 0
            foreach ($line in $lines) {
              if ($count -ge 40) { break }
              $clean = $line.Trim() -replace '%', '%25' -replace "`r", ' '
              if ($clean.Length -gt 400) { $clean = $clean.Substring(0, 400) }
              Write-Host "::error::$clean"
              $count++
            }
            if ($count -eq 0 -or -not $summarised) {
              foreach ($line in (Get-Content -LiteralPath $log -Tail 30)) {
                $clean = $line -replace '%', '%25' -replace "`r", ' '
                if ($clean.Length -gt 400) { $clean = $clean.Substring(0, 400) }
                Write-Host "::error::$clean"
              }
            }
            throw "self-test failed (exit code $($p.ExitCode))"
          }

      - name: Install Qt 5 and Qt 6 hosts for physical topbar regression scenes
        if: matrix.label == 'MSI latest package'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated Qt contract-scene runtimes
        if: matrix.label == 'MSI latest package'
        run: python -m pip install PySide6==6.8.3 PyQt5==5.15.11
      - name: Physically test production topbar scenes with host/isolated fonts and a nonpainting negative in Qt 6
        if: matrix.label == 'MSI latest package'
        env:
          BSI_TOPBAR_TEST_FIXTURES: ${{ runner.temp }}/topbar-ui
        run: python tests/run_qt_runtime_test.py tests/clean_player_ui_capture_test.py
      - name: Test the same production-written scenes with host/isolated fonts and a nonpainting negative in Qt 5
        if: matrix.label == 'MSI latest package'
        env:
          BSI_TOPBAR_TEST_FIXTURES: ${{ runner.temp }}/topbar-ui
          BSI_TEST_QT_API: PyQt5
        run: python tests/run_qt_runtime_test.py tests/clean_player_ui_capture_test.py

      - name: Manual Settings-panel tester (safe-copy apply)
        if: matrix.label == 'MSI latest package'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          # The app manifest requests elevation; this CLI-only tester operates
          # on a temporary copy, so bypass UAC just like the regular CI self-test.
          __COMPAT_LAYER: RUNASINVOKER
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'HD-Player.exe'
          $manualTester = Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-SettingsPanel-Manual.ps1'
          & $manualTester -CustomizerPath $env:exe -PlayerPath $target -NoLaunch

      - name: Upload actual topbar paint/control regression pixels
        if: always() && matrix.label == 'MSI latest package'
        uses: actions/upload-artifact@v4
        with:
          name: topbar-qt-pixels-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/topbar-ui/**/*.png
            ${{ runner.temp }}/topbar-ui/capture-validation/**/result.log
          if-no-files-found: ignore

      # A failing job's log cannot be read back through the API on this account,
      # and the annotations only carry the lines that mention failure. The whole
      # log is published as an artifact so the run can be read afterwards.
      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: ${{ runner.temp }}/selftest.log
          if-no-files-found: ignore
