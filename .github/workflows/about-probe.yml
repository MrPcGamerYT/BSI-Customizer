name: About probe

# Temporary: build the tool and run --about-probe against the real HD-Player
# builds so the Settings->About editor can be fixed from actual data instead of
# assumptions. Delete once the editor works on every build.
on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: about-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  probe:
    name: Probe real players
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        env:
          ZLP_AUTH_JSON: ${{ secrets.ZLP_AUTH_JSON || secrets.BSIC_AUTH_JSON }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBSI_BUILD_PORTABLE=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Fetch the real players
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'players'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = 'https://github.com/MrPcGamerYT/HD-Player/raw/main'
          $names = @('HD-Player MSI v5.9.exe', 'HD-Player v.5.10 bluestacks.exe')
          foreach ($name in $names) {
            $target = Join-Path $dir $name
            Invoke-WebRequest -Uri "$base/$([uri]::EscapeDataString($name))" -OutFile $target -UseBasicParsing
            Write-Output ("downloaded {0} {1} bytes" -f $name, (Get-Item $target).Length)
          }
          $zip = Join-Path $dir 'bs5.zip'
          Invoke-WebRequest -Uri "$base/HD-Player%20latest%20version%20Bluestacks%205.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'bs522') -Force
          Get-ChildItem -Recurse $dir | Where-Object { -not $_.PSIsContainer } |
            ForEach-Object { Write-Output ("have {0} {1}" -f $_.FullName, $_.Length) }
          "PLAYER_DIR=$dir" >> $env:GITHUB_ENV

      - name: Run the probe
        run: |
          $exe = (Resolve-Path build/Release/BSI-Customizer.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'probe.txt'
          $files = @(Get-ChildItem -Recurse $env:PLAYER_DIR -Filter '*.exe' |
                     Where-Object { $_.Length -gt 1MB })
          Remove-Item $out -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $log = Join-Path $env:RUNNER_TEMP 'one.txt'
            $p = Start-Process -FilePath $exe -ArgumentList @('--about-probe', $file.FullName) `
                 -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            "===== $($file.Name) (exit $($p.ExitCode)) =====" | Add-Content $out
            Get-Content $log -ErrorAction SilentlyContinue | Add-Content $out
            Get-Content "$log.err" -ErrorAction SilentlyContinue | Add-Content $out
            Write-Output "===== $($file.Name) exit=$($p.ExitCode) ====="
            Get-Content $log -ErrorAction SilentlyContinue
          }
          "PROBE_FILE=$out" >> $env:GITHUB_ENV

      - name: Publish the report
        if: always()
        run: |
          if (-not (Test-Path $env:PROBE_FILE)) { Write-Output 'no probe output'; exit 0 }
          $lines = @(Get-Content $env:PROBE_FILE)
          "### About probe" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $lines | Select-Object -First 400 | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }
          '```' >> $env:GITHUB_STEP_SUMMARY
          # check-run annotations are the only output this environment can read
          $clean = @($lines | ForEach-Object { ($_ -replace '[\r\n]+', ' ').Trim() } | Where-Object { $_ -ne '' })
          $chunk = [math]::Ceiling($clean.Count / 6)
          for ($i = 0; $i -lt 6; ++$i) {
            $slice = $clean | Select-Object -Skip ($i * $chunk) -First $chunk
            if ($slice) {
              $file = Join-Path $env:RUNNER_TEMP ("ann{0}.txt" -f $i)
              $slice | ForEach-Object { "::error::$_" } | Set-Content -LiteralPath $file
            }
          }

      - name: Annotate 0
        if: always()
        run: if (Test-Path "$env:RUNNER_TEMP/ann0.txt") { Get-Content "$env:RUNNER_TEMP/ann0.txt" | ForEach-Object { Write-Output $_ } }

      - name: Annotate 1
        if: always()
        run: if (Test-Path "$env:RUNNER_TEMP/ann1.txt") { Get-Content "$env:RUNNER_TEMP/ann1.txt" | ForEach-Object { Write-Output $_ } }

      - name: Annotate 2
        if: always()
        run: if (Test-Path "$env:RUNNER_TEMP/ann2.txt") { Get-Content "$env:RUNNER_TEMP/ann2.txt" | ForEach-Object { Write-Output $_ } }

      - name: Annotate 3
        if: always()
        run: if (Test-Path "$env:RUNNER_TEMP/ann3.txt") { Get-Content "$env:RUNNER_TEMP/ann3.txt" | ForEach-Object { Write-Output $_ } }

      - name: Annotate 4
        if: always()
        run: if (Test-Path "$env:RUNNER_TEMP/ann4.txt") { Get-Content "$env:RUNNER_TEMP/ann4.txt" | ForEach-Object { Write-Output $_ } }

      - name: Annotate 5
        if: always()
        run: if (Test-Path "$env:RUNNER_TEMP/ann5.txt") { Get-Content "$env:RUNNER_TEMP/ann5.txt" | ForEach-Object { Write-Output $_ } }
