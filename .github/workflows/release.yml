name: Single EXE Release

# Requires the repository's scripts/ and packaging/portable/ helpers.
#
# The Releases page always receives the raw, single portable EXE - never a
# zip. The EXE is published from the tested Windows job itself, so releases do
# not consume the repository's Actions artifact-storage quota.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        # Type the version here when running manually: the whole run (built
        # EXE name, BSI_VERSION inside the binary, tag and release) follows it,
        # no need to bump CMakeLists or to have any matching tag prepared.
        description: 'Release version, e.g. 2.0.1 (empty = use CMake project version)'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Publish a direct EXE download in Releases (otherwise build + self-test only)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark a newly created release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: single-exe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.8.3"

jobs:
  build-windows:
    name: Build & self-test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      exe_name: ${{ steps.meta.outputs.exe_name }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate release version
        id: meta
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($text, 'project\s*\([^)]*?VERSION\s+([0-9]+(?:\.[0-9]+){2,3})')
          if (-not $match.Success) {
            throw 'Project version is missing from CMakeLists.txt'
          }
          $version = $match.Groups[1].Value

          # Manual runs may override the release version right from the Run
          # workflow box. Only digits/dots survive the check below, so baking
          # it into the build is safe; the checkout is ephemeral (nothing is
          # committed back to the repo).
          $typed = '${{ inputs.version }}'.Trim()
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $typed -ne '') {
            if ($typed -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$') {
              throw "Typed version '$typed' is not a valid version like 2.0.1"
            }
            $version = $typed
            $patched = [regex]::Replace($text,
              '(project\s*\([^)]*?VERSION\s+)[0-9]+(?:\.[0-9]+){2,3}',
              "`${1}$version")
            Set-Content -Path CMakeLists.txt -Value $patched -NoNewline
            Write-Output "Manual run: using typed version $version (CMakeLists patched for this build)."
          }

          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version. Update CMakeLists.txt before tagging."
          }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot identify the checked-out commit'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "exe_name=BSI-Customizer-$version-win64.exe" >> $env:GITHUB_OUTPUT

      - name: Install Qt 6 build tools
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure application and one-file package
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DBSI_TEST_QT5_REFERENCE=ON -DBSI_BUILD_PORTABLE=ON

      # Also bundles the runtime and runs the portable-EXE smoke tests.
      - name: Build and verify single portable EXE
        run: cmake --build build --config Release --parallel

      - name: Verify application administrator manifest
        run: ./scripts/Test-Manifest.ps1 -ExecutablePath build/Release/BSI-Customizer.exe

      - name: Run all engine tests including real Qt 5 and Qt 6 DLLs
        env:
          QT_QPA_PLATFORM: offscreen
          __COMPAT_LAYER: RUNASINVOKER
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path build/Release/BSI-Customizer.exe).Path
          $log = Join-Path $env:RUNNER_TEMP 'bsi-selftest.log'
          $err = Join-Path $env:RUNNER_TEMP 'bsi-selftest.err'
          $process = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern 'ALL TESTS PASSED' -Quiet)) {
            throw "Self-tests failed (exit $($process.ExitCode))"
          }

      - name: Record the one-file artifact
        id: artifact
        env:
          EXE_NAME: ${{ steps.meta.outputs.exe_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem build/artifacts -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne $env:EXE_NAME) {
            throw 'The distributable directory must contain exactly the portable EXE'
          }
          $sha = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "### Single portable EXE" >> $env:GITHUB_STEP_SUMMARY
          "File: **$env:EXE_NAME**" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      # Publish directly from the same Windows job that built and tested the
      # executable. A cross-job upload/download through Actions artifacts can
      # fail before publishing when the repository artifact quota is full.
      - name: Validate and publish the tested portable EXE
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_COMMIT: ${{ steps.meta.outputs.commit }}
          EXE_NAME: ${{ steps.meta.outputs.exe_name }}
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXE_NAME" == "BSI-Customizer-$VERSION-win64.exe" ]]
          [[ "$(find build/artifacts -maxdepth 1 -type f | wc -l)" -eq 1 ]]

          asset="build/artifacts/$EXE_NAME"
          echo "$EXPECTED_SHA256  $asset" | sha256sum --check --strict

          tag="v$VERSION"

          # Never attach a different build to an old source tag.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > tag.json 2> tag-error.txt; then
            type=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type')
            sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')

            for attempt in {1..8}; do
              [[ "$type" == "tag" ]] || break
              type=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.type')
              sha=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.sha')
            done

            if [[ "$type" != "commit" || "$sha" != "$BUILD_COMMIT" ]]; then
              echo "Tag $tag already exists and points at a different commit." >&2
              echo "Re-run the workflow with a fresh version in the 'version' box (e.g. $VERSION → next patch)." >&2
              exit 1
            fi
          elif ! grep -q 'HTTP 404' tag-error.txt; then
            cat tag-error.txt >&2
            exit 1
          fi

          # The raw EXE goes into Releases exactly as built - never inside a
          # zip. An existing release for this exact commit just gets its asset
          # replaced; otherwise a fresh tag/release is created on it.
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --repo "$GH_REPO" --clobber
          else
            flags=()
            [[ "$PRERELEASE" != "true" ]] || flags+=(--prerelease)

            gh release create "$tag" "$asset" \
              --repo "$GH_REPO" \
              --target "$BUILD_COMMIT" \
              --title "BSI Customizer $VERSION" \
              --generate-notes \
              "${flags[@]}"
          fi

          echo "Published $EXE_NAME (SHA-256 $EXPECTED_SHA256)" \
            >> "$GITHUB_STEP_SUMMARY"
