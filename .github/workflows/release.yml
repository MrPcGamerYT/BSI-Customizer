name: Single EXE Release

# Requires the repository's scripts/ and packaging/portable/ helpers.
#
# The Releases page always receives the raw, single portable EXE - never a
# zip. The EXE is published from the tested Windows job itself, so releases do
# not consume the repository's Actions artifact-storage quota.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Windows runner (self-hosted requires your registered Windows x64 PC)'
        type: choice
        options:
          - windows-latest
          - self-hosted
        default: windows-latest
      version:
        # Type the version here when running manually: the whole run (built
        # EXE name, BSI_VERSION inside the binary, tag and release) follows it,
        # no need to bump CMakeLists or to have any matching tag prepared.
        description: 'Release version, e.g. 2.0.1 (empty = use CMake project version)'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Publish a direct EXE download in Releases (otherwise build + self-test only)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark a newly created release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: single-exe-${{ github.event_name }}-${{ github.ref }}
  # Superseded test builds should not block the latest installer. Never cancel
  # a tag release or an explicitly requested manual publication.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish_release) }}

env:
  QT_VERSION: "6.8.3"
  # The self-test never talks to Discord: the updater is disabled in every job
  # that only builds and verifies the EXE (the publish step below uses the
  # script directly).
  BSI_NO_UPDATER: "1"

jobs:
  build-windows:
    name: Build & self-test (Windows x64)
    # Only an explicit manual run can select a self-hosted PC. PR code always
    # uses an isolated hosted runner, never a contributor-controlled local job.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "Windows", "X64"]') || 'windows-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
      # The build step republishes a failure as a PR comment: the job log of a
      # failed run is not readable from this account's API.
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      exe_name: ${{ steps.meta.outputs.exe_name }}
      setup_name: ${{ steps.meta.outputs.setup_name }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      setup_sha256: ${{ steps.installer.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve and validate release version
        id: meta
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($text, 'project\s*\([^)]*?VERSION\s+([0-9]+(?:\.[0-9]+){2,3})')
          if (-not $match.Success) {
            throw 'Project version is missing from CMakeLists.txt'
          }
          $version = $match.Groups[1].Value

          # Manual runs may override the release version right from the Run
          # workflow box. Only digits/dots survive the check below, so baking
          # it into the build is safe; the checkout is ephemeral (nothing is
          # committed back to the repo).
          $typed = '${{ inputs.version }}'.Trim()
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $typed -ne '') {
            if ($typed -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$') {
              throw "Typed version '$typed' is not a valid version like 2.0.1"
            }
            $version = $typed
            $patched = [regex]::Replace($text,
              '(project\s*\([^)]*?VERSION\s+)[0-9]+(?:\.[0-9]+){2,3}',
              "`${1}$version")
            Set-Content -Path CMakeLists.txt -Value $patched -NoNewline
            Write-Output "Manual run: using typed version $version (CMakeLists patched for this build)."
          }

          # A tag names the release, so it has to match the version the commit
          # it points at declares. This is also what catches a tag created on
          # the wrong branch (or on a stale local one): the run then fails here,
          # before anything is built, and says which commit is at fault instead
          # of leaving a bare "exit code 1" in the log.
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            $sha = (git rev-parse HEAD).Trim()
            $short = $sha.Substring(0, [Math]::Min(7, $sha.Length))
            $hint = "Tag {0} points at commit {1}, whose CMakeLists.txt declares version {2}. " +
                    "A tag must sit on the commit that declares the same version; " +
                    "re-create it there: git tag -f -a {0} -m ""..."" <commit>"
            throw ($hint -f $env:GITHUB_REF_NAME, $short, $version)
          }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot identify the checked-out commit'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "exe_name=BSI-Customizer-$version-win64.exe" >> $env:GITHUB_OUTPUT
          "setup_name=BSI-Customizer-$version-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Install Qt 6 build tools
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure application and one-file package
        env:
          # Whole auth.json to bake into the released EXE (falls back to the
          # BSIC_AUTH_JSON secret name; empty = release ships without an
          # embedded config and a sidecar auth.json is required).
          ZLP_AUTH_JSON: ${{ secrets.ZLP_AUTH_JSON || secrets.BSIC_AUTH_JSON }}
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DBSI_TEST_QT5_REFERENCE=ON -DBSI_BUILD_PORTABLE=ON

      # Also bundles the runtime and runs the portable-EXE smoke tests.
      #
      # A failure here has to say why. This account cannot read a failed job's
      # log back through the API (the blob-storage redirect answers EOF), but
      # check-run annotations and PR comments are readable - so the compiler
      # errors, or when there is none the tail of the output (which is where a
      # packaging or smoke-test failure prints its reason), are republished.
      - name: Build and verify single portable EXE
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'release-build.log'
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0) { exit 0 }

          $pattern = ': (error|fatal error) [A-Z]+[0-9]+'
          $hits = Select-String -Path $log -Pattern $pattern -Context 0, 1
          $count = 0
          foreach ($hit in $hits) {
            if ($count -ge 40) { break }
            $text = $hit.Line.Trim()
            if ($hit.Context.PostContext.Count -gt 0) {
              $text += ' ' + ($hit.Context.PostContext -join ' ')
            }
            $text = $text -replace '%', '%25' -replace "`r", ' ' -replace "`n", ' '
            if ($text.Length -gt 400) { $text = $text.Substring(0, 400) }
            Write-Host "::error::$text"
            $count++
          }
          if ($count -eq 0) {
            Write-Host '::error::the build, the packaging or the smoke test failed without a compiler error line'
          }
          # The last lines are the only place a smoke test says what it
          # rejected, and the annotations above are capped, so the tail is put
          # where a reviewer can read all of it.
          $tail = (Get-Content -LiteralPath $log -Tail 120) -join "`n"
          $fence = '```'
          $body = "The build or the one-file smoke test failed. Last 120 lines of the build log:`n`n$fence`ntext`n$tail`n$fence`n"
          $file = Join-Path $env:RUNNER_TEMP 'failure.md'
          $body | Out-File -FilePath $file -Encoding utf8
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            gh pr comment $env:PR_NUMBER --body-file $file 2>&1 | Out-Null
          }
          $summary = $env:GITHUB_STEP_SUMMARY
          if ($summary) { $body | Out-File -FilePath $summary -Encoding utf8 -Append }
          exit 1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

      - name: Verify application administrator manifest
        run: ./scripts/Test-Manifest.ps1 -ExecutablePath build/Release/BSI-Customizer.exe

      - name: Run all engine tests including real Qt 5 and Qt 6 DLLs
        env:
          QT_QPA_PLATFORM: offscreen
          __COMPAT_LAYER: RUNASINVOKER
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path build/Release/BSI-Customizer.exe).Path
          $log = Join-Path $env:RUNNER_TEMP 'bsi-selftest.log'
          $err = Join-Path $env:RUNNER_TEMP 'bsi-selftest.err'
          $process = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern 'ALL TESTS PASSED' -Quiet)) {
            throw "Self-tests failed (exit $($process.ExitCode))"
          }

      - name: Record the one-file artifact
        id: artifact
        env:
          EXE_NAME: ${{ steps.meta.outputs.exe_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path 'build/artifacts' $env:EXE_NAME
          if (-not (Test-Path $exe)) {
            throw "The build did not produce $env:EXE_NAME"
          }
          $others = @(Get-ChildItem build/artifacts -File | Where-Object { $_.Name -ne $env:EXE_NAME })
          if ($others.Count -ne 0) {
            throw "Unexpected files in build/artifacts: $($others.Name -join ', ')"
          }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "### Single portable EXE" >> $env:GITHUB_STEP_SUMMARY
          "File: **$env:EXE_NAME**" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      # The download people get is the installer; the self-update runs it, which
      # is the only way an update can replace a program Windows has open. The
      # portable EXE stays in the same release for anyone who wants it.
      - name: Build the installer
        id: installer
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          EXE_NAME: ${{ steps.meta.outputs.exe_name }}
          SETUP_NAME: ${{ steps.meta.outputs.setup_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Host
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup (ISCC.exe) is not available on this runner'
          }
          $source = (Resolve-Path (Join-Path 'build/artifacts' $env:EXE_NAME)).Path
          $out = (Resolve-Path 'build/artifacts').Path
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceExe=$source" "/DOutputDir=$out" `
              'packaging/installer/BSI-Customizer.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }
          $setup = Join-Path $out $env:SETUP_NAME
          if (-not (Test-Path $setup)) {
            throw "The installer was not produced as $env:SETUP_NAME"
          }
          $sha = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "### Installer" >> $env:GITHUB_STEP_SUMMARY
          "File: **$env:SETUP_NAME** ($([math]::Round((Get-Item $setup).Length / 1MB, 1)) MB)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      # The one thing reading the source cannot stand in for: the bytes Inno
      # Setup actually produced. The updater verifies a finished download with
      # this same code, and 2.5.1 shipped a setup the app itself deleted at
      # 100% ("not a 64-bit program") because the check asked a 32-bit setup
      # stub for the app's machine. A setup the updater would refuse now fails
      # here - on the pull request, before a tag can publish it.
      - name: The updater accepts the installer it just built
        env:
          QT_QPA_PLATFORM: offscreen
          SETUP_NAME: ${{ steps.meta.outputs.setup_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build/Release/BSI-Customizer.exe').Path
          $setup = (Resolve-Path (Join-Path 'build/artifacts' $env:SETUP_NAME)).Path
          $log = Join-Path $env:RUNNER_TEMP 'verify-update.log'
          $process = Start-Process -FilePath $exe `
              -ArgumentList '--check-updates', '--verify-file', $setup `
              -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log
          Get-Content $log -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern 'VERDICT: the updater would keep this file' -Quiet)) {
            Get-Content $log -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.Length -gt 400) { $_ = $_.Substring(0, 400) }
              Write-Host "::error::$($_ -replace '%', '%25')"
            }
            throw "The updater would refuse the installer it just built (exit $($process.ExitCode))"
          }
          "### Updater check" >> $env:GITHUB_STEP_SUMMARY
          "The updater accepts **$env:SETUP_NAME** (printed verdict above)." >> $env:GITHUB_STEP_SUMMARY

      - name: Install, upgrade and uninstall the actual setup
        if: ${{ runner.environment == 'github-hosted' }}
        env:
          BSI_DISPOSABLE_INSTALL_TEST: '1'
        run: |
          try {
            ./scripts/Test-Installer.ps1 -SetupPath "build/artifacts/${{ steps.meta.outputs.setup_name }}" -SourceExe "build/artifacts/${{ steps.meta.outputs.exe_name }}"
          } catch {
            Write-Host "::error::$($_.Exception.Message -replace '%', '%25')"
            throw
          }

      # Test builds need a downloadable EXE too, without creating a tag or
      # publishing a release. Keep retention short to limit storage usage.
      - name: Upload tested portable EXE
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: BSI-Customizer-${{ steps.meta.outputs.version }}-win64-${{ github.run_id }}
          path: build/artifacts/${{ steps.meta.outputs.exe_name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload tested installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: BSI-Customizer-${{ steps.meta.outputs.version }}-setup-${{ github.run_id }}
          path: build/artifacts/${{ steps.meta.outputs.setup_name }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      # Publish directly from the same Windows job that built and tested the
      # executable. A cross-job upload/download through Actions artifacts can
      # fail before publishing when the repository artifact quota is full.
      - name: Validate and publish the tested portable EXE
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_COMMIT: ${{ steps.meta.outputs.commit }}
          EXE_NAME: ${{ steps.meta.outputs.exe_name }}
          SETUP_NAME: ${{ steps.meta.outputs.setup_name }}
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_SETUP_SHA256: ${{ steps.installer.outputs.sha256 }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXE_NAME" == "BSI-Customizer-$VERSION-win64.exe" ]]
          [[ "$SETUP_NAME" == "BSI-Customizer-$VERSION-setup.exe" ]]
          [[ "$(find build/artifacts -maxdepth 1 -type f | wc -l)" -eq 2 ]]

          asset="build/artifacts/$EXE_NAME"
          setup="build/artifacts/$SETUP_NAME"
          echo "$EXPECTED_SHA256  $asset" | sha256sum --check --strict
          echo "$EXPECTED_SETUP_SHA256  $setup" | sha256sum --check --strict

          tag="v$VERSION"

          # Never attach a different build to an old source tag.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > tag.json 2> tag-error.txt; then
            type=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type')
            sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')

            for attempt in {1..8}; do
              [[ "$type" == "tag" ]] || break
              type=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.type')
              sha=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.sha')
            done

            if [[ "$type" != "commit" || "$sha" != "$BUILD_COMMIT" ]]; then
              echo "Tag $tag already exists and points at a different commit." >&2
              echo "Re-run the workflow with a fresh version in the 'version' box (e.g. $VERSION → next patch)." >&2
              exit 1
            fi
          elif ! grep -q 'HTTP 404' tag-error.txt; then
            cat tag-error.txt >&2
            exit 1
          fi

          # The installer is the download; the portable EXE rides along for
          # anyone who wants a single file. Both go into Releases exactly as
          # built - never inside a zip. An existing release for this exact
          # commit just gets its assets replaced; otherwise a fresh tag/release
          # is created on it.
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$setup" --repo "$GH_REPO" --clobber
          else
            flags=()
            [[ "$PRERELEASE" != "true" ]] || flags+=(--prerelease)

            gh release create "$tag" "$setup" "$asset" \
              --repo "$GH_REPO" \
              --target "$BUILD_COMMIT" \
              --title "BSI Customizer $VERSION" \
              --generate-notes \
              "${flags[@]}"
          fi

          echo "Published $SETUP_NAME (SHA-256 $EXPECTED_SETUP_SHA256) and $EXE_NAME" \
            >> "$GITHUB_STEP_SUMMARY"

      # The application updates itself from a Discord channel because the
      # repository is private (docs/UPDATER.md). Skipped, with a notice, until
      # the Discord secrets exist - a release never depends on Discord.
      - name: Publish the self-update to the Discord releases channel
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          EXE_NAME: ${{ steps.meta.outputs.exe_name }}
          SETUP_NAME: ${{ steps.meta.outputs.setup_name }}
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_SETUP_SHA256: ${{ steps.installer.outputs.sha256 }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.DISCORD_PUBLISH_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID || secrets.DISCORD_UPDATER_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BSI_UPDATE_HMAC_KEY: ${{ secrets.BSI_UPDATE_HMAC_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_BOT_TOKEN}${DISCORD_WEBHOOK_URL}" ]]; then
            echo "::notice::DISCORD_BOT_TOKEN / DISCORD_WEBHOOK_URL is not set - skipping the Discord self-update publish."
            exit 0
          fi

          # The manifest names the installer: the app updates by running it, so
          # a manifest pointing at the portable EXE would only ever replace the
          # program file and lose the install.
          asset="build/artifacts/$SETUP_NAME"
          [[ -f "$asset" ]]
          echo "$EXPECTED_SETUP_SHA256  $asset" | sha256sum --check --strict

          # Same notes as the GitHub release, so both say the same thing.
          notes="$(mktemp)"
          gh release view "v$VERSION" --repo "$GH_REPO" --json body -q .body > "$notes" 2>/dev/null || true

          node --version
          node updater-bot/publish.mjs \
            --exe "$asset" \
            --version "$VERSION" \
            --notes-file "$notes"

          echo "The app's \"Check now\" now offers $VERSION." >> "$GITHUB_STEP_SUMMARY"
