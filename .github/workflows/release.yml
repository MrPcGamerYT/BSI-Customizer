name: Release

# Push a tag like v2.0.0 (or run manually) -> builds the Windows .exe, checks
# the embedded UAC manifest, runs the self-test, packages it with windeployqt
# and publishes a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish a GitHub Release (creates tag v<version> from CMakeLists.txt)"
        type: boolean
        default: false
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two releases for the same ref fight over the tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.8.3"

jobs:
  build-windows:
    name: Build & release (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Resolve version / artifact name
        id: meta
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag run    -> the version comes from the tag itself (v2.0.0 -> 2.0.0).
          # Manual run -> the version comes from project(... VERSION x.y.z) in
          #               CMakeLists.txt, so the release/zip are still named
          #               after the real app version.
          if ($env:REF -like 'refs/tags/*') {
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            $txt = Get-Content CMakeLists.txt -Raw
            # Anchored on project(...) on purpose - the first "VERSION" in the
            # file belongs to cmake_minimum_required().
            if ($txt -notmatch 'project\s*\([^)]*?VERSION\s+([0-9]+(?:\.[0-9]+)*)') {
              throw 'Could not read the project VERSION from CMakeLists.txt'
            }
            $version = $Matches[1]
          }

          # A branch name may contain '/', which would break New-Item,
          # Compress-Archive and the release upload, so normalise it.
          $safe = $env:REF_NAME -replace '[^A-Za-z0-9._-]', '-'

          "name=BSI-Customizer-$safe-win64" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "version: $version   tag: v$version   package: BSI-Customizer-$safe-win64"

      - name: Locate build output
        shell: pwsh
        run: |
          # Works for the Visual Studio generator (build/Release/) as well as
          # for Ninja / NMake (build/).
          $exe = Get-ChildItem -Path build -Recurse -Filter 'BSI-Customizer.exe' -File |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            throw 'BSI-Customizer.exe not found under build/ - did the build step succeed?'
          }
          Write-Host "exe: $exe"
          "exe=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify embedded UAC manifest
        shell: pwsh
        run: |
          # The exe must carry exactly one RT_MANIFEST (id 1) resource asking
          # for requireAdministrator - that is what src/app.rc embeds, and what
          # the MSVC linker used to duplicate (CVTRES CVT1100 / LINK LNK1123).
          $sdk = Join-Path "${env:ProgramFiles(x86)}" 'Windows Kits\10\bin'
          $mt = Get-ChildItem $sdk -Recurse -Filter mt.exe -File -ErrorAction SilentlyContinue |
                Where-Object FullName -match '\\x64\\mt\.exe$' |
                Sort-Object FullName | Select-Object -Last 1
          if (-not $mt) {
            Write-Warning 'mt.exe not found - skipping manifest verification'
            exit 0
          }

          $out = Join-Path $env:RUNNER_TEMP 'embedded.manifest'
          & $mt.FullName -nologo "-inputresource:$env:exe;#1" "-out:$out" | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) {
            throw "No manifest resource (id 1) is embedded in $env:exe"
          }
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern 'requireAdministrator' -Quiet)) {
            throw 'Embedded manifest does not request administrator rights'
          }
          Write-Host 'OK: requireAdministrator manifest is embedded'

      - name: Self-test (theme changer + config engine)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          # The exe requests administrator rights.  Hosted Windows runners are
          # already elevated so this is a no-op there, but on a runner that is
          # not, it lets the test start un-elevated instead of dying with
          # error 740 ("the requested operation requires elevation").  The
          # self-test only touches %TEMP% and HKCU, so it needs no elevation.
          __COMPAT_LAYER: RUNASINVOKER
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'selftest.log'
          $err = Join-Path $env:RUNNER_TEMP 'selftest.err'

          # Start-Process rather than '&': the exe is a GUI-subsystem app, so
          # PowerShell would not wait for it, and we need its stdout captured.
          $p = Start-Process -FilePath $env:exe -ArgumentList '--selftest' `
                 -NoNewWindow -Wait -PassThru `
                 -RedirectStandardOutput $log -RedirectStandardError $err

          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue

          $passed = Select-String -Path $log -Pattern 'ALL TESTS PASSED' -Quiet
          if ($p.ExitCode -ne 0 -or -not $passed) {
            throw "self-test failed (exit code $($p.ExitCode))"
          }

      - name: Package with windeployqt
        id: package
        shell: pwsh
        env:
          STAGE: ${{ steps.meta.outputs.name }}
        run: |
          $stageDir = $env:STAGE
          $exeCopy = Join-Path $stageDir 'BSI-Customizer.exe'
          $zip = "$($stageDir).zip"

          if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item $env:exe $exeCopy

          windeployqt --release --no-translations --compiler-runtime `
                      --qmldir src/qml $exeCopy
          # windeployqt only warns (and can still exit non-zero) about the
          # BSICustomizer QML module, which is compiled into the exe itself,
          # so validate what actually landed in the staging dir instead of
          # trusting the exit code alone.
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "windeployqt exited with code $LASTEXITCODE - verifying the staged output"
          }

          foreach ($required in @('Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Qml.dll',
                                  'Qt6Quick.dll', 'platforms')) {
            if (-not (Test-Path (Join-Path $stageDir $required))) {
              throw "windeployqt did not deploy '$required' - the package would not run on a clean machine"
            }
          }

          Copy-Item README.md, LICENSE $stageDir -ErrorAction SilentlyContinue

          Write-Host '--- staged package ---'
          Get-ChildItem $stageDir -Recurse | Select-Object -ExpandProperty FullName

          Compress-Archive -Path $stageDir -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "packaging did not produce $zip" }
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Runs for a tag push, or for a manual run where "publish_release" was
      # ticked.  For the manual case the tag v<version> is created on the
      # commit that was built.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BSI Customizer ${{ steps.meta.outputs.tag }}
          files: ${{ steps.package.outputs.zip }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}

      # Build-only runs (manual, publish_release unticked) have no release to
      # attach to - keep the zip downloadable from the run's Artifacts instead.
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.publish_release != true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
