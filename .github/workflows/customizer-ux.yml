name: Customizer navigation and safe review
on:
  workflow_dispatch:
  push:
    branches: [arena/cee7044d-bsi-customizer]
  pull_request:
    paths:
      - 'src/qml/**'
      - 'tests/customizer_tools*'
      - '.github/workflows/customizer-ux.yml'
permissions:
  contents: read
jobs:
  native-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog and existing UI contracts
        run: |
          node tests/customizer_tools_test.mjs
          node tests/native_skin_ui_test.mjs
          node tests/chromium_contract_test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Qt runtime and platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libpulse0
          python -m pip install PySide6==6.8.3
      - name: Type-check every QML screen against real Qt metadata
        run: python tests/workspace_qml_lint_test.py
      - name: Test tool search, explicit recovery and stale Apply guards
        run: python tests/run_qt_runtime_test.py tests/customizer_tools_runtime_test.py
      - name: Test production native shell and lazy authorization
        run: python tests/run_qt_runtime_test.py tests/native_skin_runtime_test.py
