name: Experimental shader backends (not player certification)

on:
  pull_request:
    paths:
      - 'src/shaders/**'
      - 'src/core/NativeSettingsModel.*'
      - 'src/core/ShaderSettings*'
      - 'src/core/ShaderPackage.*'
      - 'src/core/ShaderInstall.*'
      - 'src/core/ShaderBundle.*'
      - 'src/core/ShaderActions.*'
      - 'src/core/Backend.*'
      - 'src/qml/components/ShaderInstallPanel.qml'
      - 'src/qml/pages/UiPage.qml'
      - 'src/assets/shader-notices.inc'
      - 'cmake/EmbedShaderBundle.cmake'
      - 'scripts/Build-ShaderBundle.ps1'
      - 'tests/ui_page_settings_panel_test.py'
      - 'src/core/SettingsPanelPatcher.*'
      - 'src/core/QmlText.*'
      - 'src/core/QtResource*'
      - 'src/core/PeUtils.*'
      - 'src/core/ZlibUtils.*'
      - 'src/core/BoundedZopfli.*'
      - 'src/core/ZopfliAllocator.h'
      - 'src/core/ZopfliMatch.cmake'
      - 'tests/settings_panel_window_budget_test.py'
      - 'tests/fixtures/settings-window-*'
      - 'src/third_party/minhook/**'
      - 'src/third_party/vulkan/**'
      - 'src/third_party/zopfli/**'
      - 'src/assets/settings-panel-icons/shaders.*'
      - 'tests/shaders/**'
      - 'tests/shaders_*'
      - '.github/workflows/shaders.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shader-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-vulkan-gl:
    name: Native Vulkan and GLES pixels (Mesa software; not hardware)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ASAN_OPTIONS: 'detect_leaks=1'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real software graphics APIs
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers libvulkan1 libegl1 libegl-mesa0 libgles2 qt6-base-dev
      - name: Check committed SPIR-V matches the shared original source
        run: |
          python3 tests/shaders/run_ci_tests.py --command python3 tests/shaders/zopfli_provenance_test.py
          python3 tests/shaders/run_ci_tests.py --command python3 tests/shaders/bundle_notices_test.py
          npm install --prefix "$RUNNER_TEMP/spirv-tools" --no-fund --no-audit --save-exact @webgpu/glslang@0.0.15
          BSI_CHECK_GENERATED=1 node tests/shaders/compile_spirv.cjs "$RUNNER_TEMP/spirv-tools/node_modules/@webgpu/glslang"
      - name: Native Mesa Vulkan pixels with mandatory Khronos lifetime/API validation
        env:
          BSI_SHADERS_VULKAN_VALIDATION: '1'
        run: |
          cmake -S tests/shaders -B build-shader-tests -DCMAKE_BUILD_TYPE=Debug -DBSI_TEST_NATIVE_SETTINGS=ON -DCMAKE_CXX_FLAGS='-Wall -Wextra -Werror -pedantic'
          python3 tests/shaders/run_ci_tests.py --command cmake --build build-shader-tests --parallel 2
          python3 tests/shaders/run_ci_tests.py --test-dir build-shader-tests --output-on-failure --timeout 60
      - name: ASan/UBSan routing and native Vulkan on a second software ICD
        # Mesa/LLVM leaves process-global JIT allocations reported by LSan.
        # Do not blanket-disable leak detection to hide them: run Mesa above
        # with Vulkan object/lifetime validation and run this sanitizer build
        # against pinned SwiftShader instead. No test assertion is skipped.
        run: |
          npm install --prefix "$RUNNER_TEMP/spirv-tools" --no-fund --no-audit --save-exact @sparticuz/chromium@133.0.0
          mkdir -p "$RUNNER_TEMP/shader-icd"
          node -e "const fs=require('node:fs'),z=require('node:zlib');fs.writeFileSync(process.env.RUNNER_TEMP+'/shader-icd/swiftshader.tar',z.brotliDecompressSync(fs.readFileSync(process.env.RUNNER_TEMP+'/spirv-tools/node_modules/@sparticuz/chromium/bin/swiftshader.tar.br')));"
          tar -xf "$RUNNER_TEMP/shader-icd/swiftshader.tar" -C "$RUNNER_TEMP/shader-icd"
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -Isrc/shaders tests/shaders/renderer_capabilities_test.cpp src/shaders/Runtime.cpp -o "$RUNNER_TEMP/routing-asan"
          python3 tests/shaders/run_ci_tests.py --command "$RUNNER_TEMP/routing-asan"
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/shaders -Isrc/third_party/vulkan/include tests/shaders/vulkan_pixels_test.cpp src/shaders/VulkanPipeline.cpp -ldl -o "$RUNNER_TEMP/vulkan-asan"
          BSI_SHADERS_VULKAN_LIBRARY="$RUNNER_TEMP/shader-icd/libvk_swiftshader.so" python3 tests/shaders/run_ci_tests.py --command "$RUNNER_TEMP/vulkan-asan"
      - name: ASan/UBSan native source, package, file recovery and every encoder allocation failure
        run: |
          cmake -S tests/shaders -B build-shader-core-asan -DCMAKE_BUILD_TYPE=Debug -DBSI_TEST_NATIVE_SETTINGS=ON -DBSI_TEST_VULKAN=OFF -DCMAKE_C_FLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          python3 tests/shaders/run_ci_tests.py --command cmake --build build-shader-core-asan --parallel 2
          python3 tests/shaders/run_ci_tests.py --test-dir build-shader-core-asan --output-on-failure --timeout 180
      - name: Production GLES and desktop OpenGL core pixels/state restoration
        run: |
          python3 tests/shaders/run_ci_tests.py --command python3 tests/shaders_gpu_test.py
          BSI_SHADERS_EGL_API=opengl python3 tests/shaders/run_ci_tests.py --command python3 tests/shaders_gpu_test.py
      - name: Record scope of results
        run: echo 'Software/API tests only. No HD-Player installation, Win32 presentation hook or Intel/AMD/NVIDIA hardware certification is implied.' >> "$GITHUB_STEP_SUMMARY"

  windows-plugin:
    name: Windows x64 Qt ${{ matrix.qt }} plugin and DirectX WARP
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: '6.8.3'
            arch: win64_msvc2022_64
            python-api: PySide6
            python-package: PySide6==6.8.3
          - qt: '5.15.2'
            arch: win64_msvc2019_64
            python-api: PyQt5
            python-package: PyQt5==5.15.11
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ matrix.qt }}
          host: windows
          target: desktop
          arch: ${{ matrix.arch }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching Qt Python host for real plugin component tests
        run: python -m pip install '${{ matrix.python-package }}'
      - name: Build regular plugin, MinHook and native DirectX tests (no system proxy)
        run: |
          python tests/shaders/run_ci_tests.py --command python tests/shaders/zopfli_provenance_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compression provenance check failed' }
          python tests/shaders/run_ci_tests.py --command python tests/shaders/bundle_notices_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Complete shader binary redistribution notices check failed' }
          python tests/shaders/run_ci_tests.py --command cmake -S src/shaders -B build-shaders -A x64 -DBSI_SHADERS_BUILD_TESTS=ON -DBSI_TEST_NATIVE_SETTINGS=ON -DBSI_TEST_VULKAN=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Shader configuration failed' }
          python tests/shaders/run_ci_tests.py --command cmake --build build-shaders --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Shader build failed' }
      - name: Native DirectX 11 and 12 WARP frame pixels
        run: python tests/shaders/run_ci_tests.py --test-dir build-shaders -C Release --output-on-failure --timeout 60
      - name: Actual C++ plugin import and physical shader-page controls (Qt fixture only)
        env:
          BSI_TEST_QT_API: ${{ matrix.python-api }}
          BSI_SHADERS_MODULE_ROOT: ${{ github.workspace }}/build-shaders/module
          BSI_SHADERS_DIAGNOSTICS: '1'
        run: python tests/shaders/run_ci_tests.py --command python -X faulthandler -u tests/shaders_plugin_ui_test.py
      - name: Physical native Settings navigation, prompts and missing-module fallback (contract fixture)
        env:
          BSI_TEST_QT_API: ${{ matrix.python-api }}
          BSI_SHADERS_MODULE_ROOT: ${{ github.workspace }}/build-shaders/module
          BSI_SHADERS_SOURCE_TEST: ${{ github.workspace }}/build-shaders/tests/Release/shader-settings-source-test.exe
          BSI_SHADERS_DIAGNOSTICS: '1'
        run: |
          python tests/shaders/run_ci_tests.py --command python -X faulthandler -u tests/shaders_native_settings_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Settings contract fixture failed' }
          python tests/shaders/run_ci_tests.py --command python -X faulthandler -u tests/shaders_native_settings_test.py --missing-module
          if ($LASTEXITCODE -ne 0) { throw 'Missing shader module fallback failed' }
      - name: Record limits rather than claim universal support
        shell: pwsh
        run: "'Windows Qt fixture + WARP API tests only. Not HD-Player category navigation, game presentation hooks or physical Intel/AMD/NVIDIA certification. No merge authorized by these tests alone.' | Out-File $env:GITHUB_STEP_SUMMARY -Append"
