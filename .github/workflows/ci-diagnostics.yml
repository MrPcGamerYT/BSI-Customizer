name: CI diagnostics

# Temporary: the Actions job log cannot be downloaded from this environment, so
# this workflow rebuilds the same configuration and republishes the interesting
# lines as check-run annotations, which the API does return. Delete it once the
# build is green again.
on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  build:
    name: Diagnostic build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        env:
          ZLP_AUTH_JSON: ${{ secrets.ZLP_AUTH_JSON || secrets.BSIC_AUTH_JSON }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (captured)
        id: build
        continue-on-error: true
        run: |
          cmake --build build --config Release --parallel *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\build.log"
          exit $LASTEXITCODE

      - name: Collect lines
        if: steps.build.outcome == 'failure'
        run: |
          $log = "$env:RUNNER_TEMP\build.log"
          $all = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue |
                   ForEach-Object { $_ -replace "`e\[[0-9;]*[A-Za-z]", '' })

          # compiler / linker / cmake failures
          $errors = @($all | Where-Object {
              $_ -match 'error [A-Z]+[0-9]{3,4}' -or
              $_ -match 'fatal error' -or
              $_ -match 'error LNK' -or
              $_ -match 'CMake Error' -or
              $_ -match 'undefined reference'
          })
          $errors | Select-Object -First 10 | Set-Content -LiteralPath "$env:RUNNER_TEMP\errors.txt"

          # the tail of the log: the portable-EXE smoke test prints its own
          # DEPLOYMENT_* diagnosis and the QML errors there
          $noise = 'MSBuild|\.vcxproj|CMakeFiles\\|Done building|Build FAILED|Total time|^\s*$|ninja:'
          $detail = @($all | Where-Object { $_ -notmatch $noise } | Select-Object -Last 30)
          $detail | Set-Content -LiteralPath "$env:RUNNER_TEMP\detail.txt"

          Write-Output "log lines: $($all.Count), error lines: $($errors.Count), detail lines: $($detail.Count)"
          Write-Output '--- detail tail ---'
          $detail | Write-Output

      - name: Build errors
        if: steps.build.outcome == 'failure'
        run: |
          $f = "$env:RUNNER_TEMP\errors.txt"
          if (Test-Path $f) {
            Get-Content $f | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace '[\r\n]+', ' ').Trim())
            }
          }

      - name: Detail 1/3
        if: steps.build.outcome == 'failure'
        run: |
          $f = "$env:RUNNER_TEMP\detail.txt"
          if (Test-Path $f) {
            Get-Content $f | Select-Object -Skip 0 -First 10 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace '[\r\n]+', ' ').Trim())
            }
          }

      - name: Detail 2/3
        if: steps.build.outcome == 'failure'
        run: |
          $f = "$env:RUNNER_TEMP\detail.txt"
          if (Test-Path $f) {
            Get-Content $f | Select-Object -Skip 10 -First 10 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace '[\r\n]+', ' ').Trim())
            }
          }

      - name: Detail 3/3
        if: steps.build.outcome == 'failure'
        run: |
          $f = "$env:RUNNER_TEMP\detail.txt"
          if (Test-Path $f) {
            Get-Content $f | Select-Object -Skip 20 -First 10 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace '[\r\n]+', ' ').Trim())
            }
          }

      - name: Fail the job when the build failed
        if: steps.build.outcome == 'failure'
        run: throw 'The build failed; see the annotations above for the log tail.'
