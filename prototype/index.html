<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0c1018" />
    <title>BSI Studio — Interface concept</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Application sidebar">
        <a class="brand" href="#dashboard"
          ><span class="brand-mark" aria-hidden="true">b<span>i</span></span
          ><span
            >BSI <b>Studio</b><small>CUSTOMIZER / 2.7 CONCEPT</small></span
          ></a
        >
        <div class="workspace-select">
          <span class="workspace-icon" data-icon="layers"></span>
          <div>
            Personal workspace<small>BlueStacks & MSI App Player</small>
          </div>
          <span class="online-dot"></span>
        </div>
        <nav id="navigation" aria-label="Main navigation"></nav>
        <div class="sidebar-bottom">
          <div class="local-note">
            <span data-icon="shield"></span>
            <div>Your files stay yours<small>Local-first. Always.</small></div>
          </div>
          <button class="profile" id="profile-button">
            <span class="avatar">PC</span
            ><span>Mr. PC Gamer<small>Design preview</small></span
            ><span data-icon="settings"></span>
          </button>
        </div>
      </aside>
      <div class="shell">
        <header class="topbar">
          <div class="breadcrumb">
            Workspace <span>/</span> <b id="breadcrumb">Overview</b>
          </div>
          <div class="top-actions">
            <span class="preview-tag"><i></i> INTERACTIVE CONCEPT</span
            ><button
              class="icon-button"
              id="appearance-shortcut"
              aria-label="Open appearance settings"
              data-icon="sun"
            ></button
            ><button
              class="icon-button"
              id="activity-shortcut"
              aria-label="Open activity log"
              data-icon="activity"
            ></button
            ><span class="top-avatar">PC</span>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
        <footer>
          <span
            ><i class="online-dot"></i> Design sandbox
            <span class="footer-divider">/</span> No emulator connected</span
          ><span>Built for your player. Designed around you.</span>
        </footer>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <div class="dialog-icon" data-icon="shield"></div>
        <h2 id="dialog-title">Preview action</h2>
        <p id="dialog-description"></p>
        <div class="dialog-actions">
          <button class="button secondary" value="cancel">Cancel</button
          ><button class="button primary" value="confirm">
            Simulate action <span data-icon="arrow"></span>
          </button>
        </div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
